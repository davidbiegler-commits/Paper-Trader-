<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1726">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paper Trader">
<title>Paper Trader</title>
<style>
  html,body{height:100%;margin:0;background:#0D1726;color:#8C9CB5;font:15px -apple-system,system-ui,sans-serif}
  .c{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  .s{width:28px;height:28px;border:3px solid #26395A;border-top-color:#E9B949;border-radius:50%;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  button{font:inherit;font-weight:600;padding:10px 18px;border-radius:10px;border:0;background:#E9B949;color:#1a1300}
</style>
</head>
<body>
<div class="c" id="c"><div class="s"></div><div>Paper Trader wird geladen …</div></div>
<script>
// Lader: holt das Dashboard immer in der neuesten Version aus Supabase (nur öffentlicher Lese-Schlüssel).
// Diese Datei muss nie wieder geändert werden – Updates landen direkt in der Datenbank.
const URL_ = "https://meexklgjnfogrobnmyxg.supabase.co/rest/v1/pt_app?id=eq.1&select=version,html";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lZXhrbGdqbmZvZ3JvYm5teXhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3OTM1NDYsImV4cCI6MjEwNjM2OTU0Nn0.FffnKPmbxRizmjFFou5JXbBvNaNc1KdsLNujVtMxY-E";
function show(app){
  const html = app.html.split("__APP_VERSION__").join(String(app.version));
  document.open(); document.write(html); document.close();
}
function cached(){ try{ return JSON.parse(localStorage.getItem("pt_app")||"null"); }catch(e){ return null; } }
(async () => {
  try{
    const r = await fetch(URL_, { headers: { apikey: KEY, Authorization: "Bearer " + KEY }, cache: "no-store" });
    if(!r.ok) throw new Error("HTTP " + r.status);
    const app = (await r.json())[0];
    if(!app || !app.html) throw new Error("Keine App-Version gefunden");
    try{ localStorage.setItem("pt_app", JSON.stringify(app)); }catch(e){}
    show(app);
  }catch(e){
    const c = cached();
    if(c){ show(c); return; }   // offline: letzte bekannte Version
    document.getElementById("c").innerHTML = `<div>Dashboard konnte nicht geladen werden.<br><small>${String(e.message||e)}</small></div><button onclick="location.reload()">Erneut versuchen</button>`;
  }
})();
</script>
</body>
</html>
